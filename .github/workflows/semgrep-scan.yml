name: Semgrep scan

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: '0 3 * * 1' # every Monday at 3:00 AM

jobs:
    semgrep:
        name: Semgrep SAST
        uses: 0xtr1gger/secureflow/.github/workflows/semgrep.yml@main
        with:
            semgrep_config: 'p/default,p/python,p/flask,p/security-audit'            severity: 'ERROR'
            upload_sarif: true
            fail_on_findings: false
            exclude_paths: 'tests,.github'
        