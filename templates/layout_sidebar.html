{% extends "base.html" %}

{% block body %}
<div class="layout">
    <!-- ── Sidebar ────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('index') }}" class="sidebar-logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">AppSec Lab</span>
            </a>
        </div>

        <nav class="sidebar-nav" aria-label="Vulnerability navigation">
            <span class="sidebar-section-label">Vulnerability Labs</span>
            <ul class="sidebar-menu">
                {% for v in vulnerabilities %}
                <li>
                    <a href="/{{ v.id }}/"
                       class="sidebar-link {% if request.path.startswith('/' + v.id) %}active{% endif %}"
                       id="nav-{{ v.id }}">
                        <span class="sidebar-link-icon">{{ v.icon }}</span>
                        <span class="sidebar-link-text">{{ v.short_title }}</span>
                        <span class="sidebar-link-badge">{{ v.cwe }}</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="https://github.com/0xtr1gger/appsec-lab" target="_blank" rel="noopener" class="sidebar-gh-link">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .3a12 12 0 00-3.8 23.38c.6.12.83-.26.83-.57v-2.23c-3.34.73-4.03-1.42-4.03-1.42a3.18 3.18 0 00-1.33-1.75c-1.09-.74.08-.73.08-.73a2.52 2.52 0 011.84 1.24 2.56 2.56 0 003.49 1 2.55 2.55 0 01.76-1.61c-2.67-.3-5.47-1.34-5.47-5.93a4.64 4.64 0 011.24-3.22 4.3 4.3 0 01.12-3.18s1-.32 3.3 1.23a11.4 11.4 0 016 0c2.28-1.55 3.28-1.23 3.28-1.23a4.3 4.3 0 01.12 3.18 4.64 4.64 0 011.24 3.22c0 4.61-2.8 5.63-5.48 5.92a2.87 2.87 0 01.82 2.23v3.29c0 .31.22.69.83.57A12 12 0 0012 .3"/></svg>
                <span>GitHub</span>
            </a>
        </div>
    </aside>

    <!-- ── Mobile hamburger ───────────────────────────────── -->
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ── Main content ───────────────────────────────────── -->
    <main class="content">
        {% block page_content %}{% endblock %}
    </main>
</div>
{% endblock %}
